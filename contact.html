<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Deep Jadav</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --text-light: #e5e5e5;
            --text-muted: #a3a3a3;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark) !important;
            color: var(--text-light) !important;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            color: var(--text-light) !important;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 50% 0%, rgba(120, 119, 198, 0.15), rgba(255, 255, 255, 0) 50%);
            pointer-events: none;
        }

        /* Navbar */
        .navbar {
            backdrop-filter: blur(16px);
            background: rgba(10, 10, 10, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-light) !important;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background: linear-gradient(to right, var(--accent-purple), var(--accent-pink));
            transition: width 0.3s;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Contact Card */
        .contact-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            transition: all 0.5s;
            position: relative;
            overflow: hidden;
        }

        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(236, 72, 153, 0.15);
            border-color: rgba(236, 72, 153, 0.3);
        }

        .contact-link {
            color: var(--text-light);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            padding-bottom: 2px;
        }

        .contact-link:hover {
            color: var(--accent-pink);
            border-color: var(--accent-pink);
        }

        /* Footer */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div class="bg-overlay"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="assets/kevinRushLogo.png" alt="Logo" class="rounded-circle border border-secondary"
                    style="width: 35px; height: 35px;">
                <span class="fw-bold text-light tracking-wide fs-5">Deep Jadav</span>
            </a>

            <button class="navbar-toggler border-0 text-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars fs-4"></i>
            </button>

            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav gap-3 gap-md-5 my-3 my-md-0">
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>

            <div class="d-none d-md-flex gap-4 fs-5">
                <a href="https://linkedin.com" target="_blank" class="text-muted hover-text-blue transition"><i
                        class="fa-brands fa-linkedin"></i></a>
                <a href="https://github.com" target="_blank" class="text-muted hover-text-white transition"><i
                        class="fa-brands fa-github"></i></a>
                <a href="https://instagram.com" target="_blank" class="text-muted hover-text-pink transition"><i
                        class="fa-brands fa-instagram"></i></a>
                <a href="https://x.com" target="_blank" class="text-muted hover-text-gray transition"><i
                        class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center py-5 mt-5">
        <h1 class="text-center display-4 fw-bold mb-5 tracking-wide text-light" data-aos="fade-down">Let’s <span
                style="color: var(--accent-pink);">Connect</span></h1>

        <div class="contact-card p-5 text-center w-100" style="max-width: 550px;" data-aos="zoom-in"
            data-aos-duration="800">
            <div class="d-flex flex-column gap-4 text-light">
                <div class="d-flex align-items-center justify-content-center gap-3">
                    <i class="fa-solid fa-location-dot fs-4 text-muted"></i>
                    <p class="mb-0 fs-5 fw-light">New Ranip, Krishna Bunglows-1, Block No-42, Ahmedabad</p>
                </div>

                <div class="d-flex align-items-center justify-content-center gap-3">
                    <i class="fa-solid fa-phone fs-4 text-muted"></i>
                    <p class="mb-0 fs-5 fw-medium">+91 958 628 175 8</p>
                </div>

                <div class="d-flex align-items-center justify-content-center gap-3">
                    <i class="fa-solid fa-envelope fs-4 text-muted"></i>
                    <a href="mailto:jadavdeep560@gmail.com" class="contact-link fs-5">jadavdeep560@gmail.com</a>
                </div>

                <div class="my-4 mx-auto"
                    style="width: 80px; height: 1px; background: linear-gradient(90deg, transparent, var(--text-muted), transparent);">
                </div>

                <div class="d-flex justify-content-center gap-5 fs-3">
                    <a href="https://linkedin.com" target="_blank" class="text-muted hover-text-blue transition"
                        data-bs-toggle="tooltip" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                    <a href="https://github.com" target="_blank" class="text-muted hover-text-white transition"
                        data-bs-toggle="tooltip" title="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="mailto:jadavdeep560@gmail.com" class="text-muted hover-text-pink transition"
                        data-bs-toggle="tooltip" title="Email"><i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="text-center text-muted py-4 mt-auto">
        <p class="small mb-0">© 2025 Deep Jadav. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
            offset: 100,
            duration: 800,
            easing: 'ease-out-cubic',
        });

        // Initialize Tooltips
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
    </script>

    <style>
        .hover-text-blue:hover {
            color: #3b82f6 !important;
        }

        .hover-text-white:hover {
            color: #ffffff !important;
        }

        .hover-text-pink:hover {
            color: #ec4899 !important;
        }

        .hover-text-gray:hover {
            color: #d1d5db !important;
        }
    </style>
</body>

</html>
